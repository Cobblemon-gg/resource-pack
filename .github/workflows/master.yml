name: Zip Resources

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  zip-resources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify overlay builder
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Build server overlay and complete fallback
        run: python3 tools/build_pack.py build
      - name: Upload release packs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/resource-pack.zip dist/resource-pack-full.zip dist/asset-size-report.json --clobber
